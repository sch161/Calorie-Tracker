<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calorie Tracker 로그인</title>
    <style>
      /* 페이지 전체 */
      body {
        margin: 0;
        font-family: "Pretendard", system-ui, sans-serif;
        background-color: #f5f3ee;
      }

      #All {
        display: grid;
        place-items: center;
        min-height: 100vh;
      }

      /* 흰색 카드 */
      .card {
        width: 320px;
        background-color: #ffffff;
        border-radius: 12px;
        padding: 40px 32px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
        text-align: center;
      }

      /* 로고 + 제목 */
      .logo {
        width: 56px;
        height: 56px;
        border-radius: 12px;
        display: block;
        margin: 0 auto;
      }

      .card h2 {
        margin: 12px 0 28px;
        font-size: 18px;
        color: #333;
      }

      /* 입력 그룹 */
      .field {
        text-align: left;
        margin-bottom: 16px;
      }

      .field label {
        display: block;
        font-size: 13px;
        color: #666;
        margin-bottom: 6px;
      }

      .field input {
        width: 100%;
        box-sizing: border-box; /*padding 포함해서 100%*/
        padding: 10px 12px;
        border: 1px solid #e0e0e0;
        border-radius: 6px;
        font-size: 14px;
        outline: none;
      }

      .field input:focus {
        border-color: #6b8e5a;
      }

      /* 로그인 버튼 */
      #loginbtn {
        width: 100%;
        padding: 12px;
        margin-top: 8px;
        background-color: #5a8b62;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 15px;
        cursor: pointer;
      }

      #loginbtn:hover {
        background-color: #5a8b62;
      }

      /* 회원가입 안내 */
      .signup {
        margin-top: 20px;
        font-size: 13px;
        color: #999;
      }

      .signup a {
        color: #333;
        font-weight: 600;
        text-decoration: none;
        margin-left: 4px;
      }
    </style>
  </head>
  <body>
    <div id="All">
      <div class="card">
        <img class="logo" src="../images/logo.png" alt="로고사진" />
        <h2>칼로리 트래커</h2>

        <div class="field">
          <label for="login_id">아이디</label>
          <input
            type="text"
            id="login_id"
            name="login_id"
            placeholder="아이디"
          />
        </div>

        <div class="field">
          <label for="login_pw">비밀번호</label>
          <input
            type="password"
            id="login_pw"
            name="login_pw"
            placeholder="비밀번호"
          />
        </div>

        <button id="loginbtn">로그인</button>

        <p class="signup">
          계정이 없으신가요?<a href="signin.html">회원가입</a>
        </p>
      </div>
    </div>
  </body>
</html>
