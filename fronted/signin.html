<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calorie Tracker 회원가입</title>
    <style>
      body {
        margin: 0;
        font-family: "Pretendard", system-ui, sans-serif;
        background-color: #f5f3ee;
      }

      #All {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 40px 0;
      }

      /* 흰색 카드 */
      .card {
        width: 380px;
        background-color: #ffffff;
        border-radius: 12px;
        padding: 28px 32px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        box-sizing: border-box;
      }

      /* 카드 헤더 (좌측 정렬) */
      .card-title {
        margin: 0;
        font-size: 22px;
        font-weight: 700;
        color: #222;
      }

      .card-subtitle {
        margin: 6px 0 24px;
        font-size: 13px;
        color: #888;
      }

      /* 입력 필드 공통 */
      .field {
        margin-bottom: 16px;
      }

      .field label {
        display: block;
        font-size: 13px;
        color: #666;
        margin-bottom: 6px;
      }

      .field input[type="text"],
      .field input[type="password"],
      .field input[type="number"] {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border: 1px solid #e0e0e0;
        border-radius: 6px;
        font-size: 14px;
        outline: none;
      }

      .field input:focus {
        border-color: #6b8e5a;
      }

      /* 나이 + 성별 가로 배치 */
      .row {
        display: flex;
        gap: 20px;
        margin-bottom: 16px;
      }

      .row .field {
        margin-bottom: 0;
      }

      .age-field {
        width: 80px;
        flex-shrink: 0;
      }

      /* 토글 버튼 그룹 (성별, 목표) */
      .toggle-group {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }

      .toggle-btn {
        padding: 7px 14px;
        background-color: #ffffff;
        border: 1px solid #d5d5d5;
        border-radius: 20px;
        font-size: 13px;
        color: #666;
        cursor: pointer;
        font-family: inherit;
      }

      .toggle-btn.active {
        background-color: #5a8b62;
        border-color: #6b8e5a;
        color: #ffffff;
      }

      /* 직접설정 선택 시 나타나는 영역 */
      .custom-calorie {
        margin-top: 16px;
        padding: 16px;
        background-color: #f5f3ee;
        border: 1px solid #e5e0d3;
        border-radius: 8px;
      }

      .custom-calorie > label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #333;
        margin-bottom: 8px;
      }

      .kcal-input-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .kcal-input-row input {
        flex: 1;
        box-sizing: border-box;
        padding: 10px 12px;
        border: 1px solid #d5d5d5;
        border-radius: 6px;
        font-size: 14px;
        outline: none;
        background-color: #ffffff;
      }

      .kcal-unit {
        font-size: 13px;
        color: #888;
        white-space: nowrap;
      }

      .helper-text {
        margin: 10px 0 0;
        font-size: 12px;
        color: #999;
      }

      /* 가입하기 버튼 */
      #signupbtn {
        width: 100%;
        padding: 13px;
        margin-top: 20px;
        background-color: #5a8b62;
        color: #ffffff;
        border: none;
        border-radius: 6px;
        font-size: 15px;
        cursor: pointer;
        font-family: inherit;
      }

      #signupbtn:hover {
        background-color: #5d7d4d;
      }
    </style>
  </head>
  <body>
    <div id="All">
      <div class="card">
        <h2 class="card-title">회원가입</h2>
        <p class="card-subtitle">맞춤 칼로리 목표를 계산해드려요</p>

        <div class="field">
          <label for="name">이름</label>
          <input type="text" id="name" name="name" placeholder="예 : 홍길동" />
        </div>

        <div class="field">
          <label for="signup_id">아이디</label>
          <input
            type="text"
            id="signup_id"
            name="signup_id"
            placeholder="영문·숫자 4-12자"
          />
        </div>

        <div class="field">
          <label for="signup_pw">비밀번호</label>
          <input
            type="password"
            id="signup_pw"
            name="signup_pw"
            placeholder="8자 이상"
          />
        </div>

        <div class="row">
          <div class="field age-field">
            <label for="age">나이</label>
            <input type="number" id="age" name="age" value="17" />
          </div>
          <div class="field">
            <label>성별</label>
            <div class="toggle-group">
              <button type="button" class="toggle-btn active">남</button>
              <button type="button" class="toggle-btn">여</button>
            </div>
          </div>
        </div>

        <div class="field">
          <label>목표</label>
          <div class="toggle-group">
            <button type="button" class="toggle-btn">다이어트</button>
            <button type="button" class="toggle-btn">유지</button>
            <button type="button" class="toggle-btn">벌크업</button>
            <button type="button" class="toggle-btn active">직접설정</button>
          </div>
        </div>

        <div class="custom-calorie">
          <label for="goal_kcal">목표 칼로리 직접 입력 (kcal)</label>
          <div class="kcal-input-row">
            <input type="text" id="goal_kcal" name="goal_kcal" value="1,800" />
            <span class="kcal-unit">kcal / 일</span>
          </div>
          <p class="helper-text">
            여기 부분은 db에서 칼로리 가져와서 비교하는 로직을 작성해야함
          </p>
        </div>

        <button id="signupbtn">가입하기</button>
      </div>
    </div>
  </body>
</html>
